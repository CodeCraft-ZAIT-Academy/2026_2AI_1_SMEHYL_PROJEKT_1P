<!DOCTYPE html>
<html lang="en">
<head>

<body style="height: 100vh; width: 100vw;">
    
    <!-- Header Section -->
    <header>

    <hero>

       </div>
       
       <p style="font-family: A1Graffiti, sans-serif; font-size: 3vw; position: absolute; top: 67%; left: 3%;">EXHAUST</p>

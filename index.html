<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/webp" href="Logo/Logo.webp" sizes="16x16">
    <script src="scripts/slider.js" defer></script> <!-- Defer - makes JS wait until the HTML elements exist -->
    <title>A1 Customs</title>
</head>

<body>
    
    <header>
        <a href="index.html" class="logo">{A1 Customs}</a>
        <div style="width: max-content; height: 55cqh; white-space: nowrap; margin-top: 25cqh">
            <a class="header-button">contact us</a>
            <a class="header-button">about us</a>
            <a href="bike-choose.html" class="header-button">configurator</a>
        </div>
    </header>
    
    
    <main class="load-in">
        
        <div class="container" id="bike-slider" style="margin-top: 20px;">
            
            <img src="stock-bikes/stockshow.webp" alt="stock bike" id="stock-bike" class="stock-bike" width="1200" height="700" draggable="false">
            <img src="stock-bikes/modshow.webp" alt="modified bike" id="mod-bike" class="mod-bike" width="1200" height="700" draggable="false">
            
            <div class="slider-line" id="slider-line"></div>
            
            <p class="photo-text" >Fantic XMF 125 Performance</p>
            
        </div>
        
        <h2 class="centering">Make it yours</h2>
        <div class="cardcont">
           
           <div class="card" style="left: 20%;">
              <img class="cardimg" src="cards/exhaust-card.png" alt="exhaust card">
              <p class="cardtext">Exhausts</p>
           </div>

           <div class="card" style="left: 20%;">
              <img class="cardimg" src="cards/graphics-card.webp" alt="graphics-card">
              <p class="cardtext">Graphics</p>
           </div>

           <div class="card" style="left: 20%;">
              <img class="cardimg" src="cards/grip-card.webp" alt="grip-card">
              <p class="cardtext">Grips</p>
           </div>

           <div class="card" style="left: 20%;">
              <img class="cardimg" src="cards/mirror-card.webp" alt="mirror-card">
              <p class="cardtext">Mirrors</p>
           </div>

        </div>

        <div>
            <h2 class="centering">customize your own</h2>
            <a href="bike-choose.html" class="modify-button">Start Customizing</a>
        </div>
            
        <div>
            <h2 class="centering">Build it your way</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; width: 60%; margin: auto; gap: 20px; margin-bottom: 20px; text-align: center;">
                <div class="build-card">
                    <img src="icons/sumo.webp" alt="engine" class="build-card-img">
                    <p class="build-card-text">Pick a bike</p>
                </div>
                <div class="build-card">
                    <img src="icons/wrench.webp" alt="exhaust" class="build-card-img">
                    <p class="build-card-text">Customize</p>
                </div>
                <div class="build-card">
                    <img src="icons/checkmark.webp" alt="graphics" class="build-card-img">
                    <p class="build-card-text">Make it yours</p>
                </div>

            </div>

        </div>
        
    </main>
    
    
    <footer style="background-color: black; width: 100%; height: 10vh; text-align: center; color: white; container-type: size; margin: 0;">
    
        <p style="padding-top: 13px; font-size: 30cqh;">© 2026 A1 Customs. All rights reserved.</p>

    </footer>

</body>

</html>

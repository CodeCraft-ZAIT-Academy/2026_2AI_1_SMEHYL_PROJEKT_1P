<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/webp" href="Logo/Logo.webp" sizes="16x16">
    <title>choose your bike</title>
</head>
<body>
    <script src="scripts/bikeselector.js"></script>
    <header>
         <a href="index.html" class="logo">{A1 Customs}</a>
         <button class="header-button" style="position: absolute; right: 30px; top: 23px;">contact us</button>
         <button class="header-button" style="position: absolute; right: 150px; top: 23px;">about us</button>
         <button class="header-button" style="position: absolute; right: 250px; top: 23px;"><a href="bike-choose.html" style="text-decoration: none; color: inherit;">configurator</a></button>
    </header>

    <Hero>
        <img src="choose_bike/background.webp" alt="Choose your bike" class="bike-choose-img" style="width: 100%; height: 100vh; object-fit: cover; position: absolute; z-index: -1; top: 0%; left: 0%;">
         <h1 style="text-align: center; font-family: 'A1Graffiti', sans-serif; font-size: 92px;">Choose your bike</h1>

         <div class="bike-list">
            <button class="bike" onclick="selectBike('wr125x')">
                <p class="bike-choose-h">Yamaha WR 125X</p>
                <img src="choose_bike/Wr125x.webp" alt="Yamaha WR 125X" class="bike-choose-img" style="width: 35%;">
                <p style="top: 30%;" class="bike-card-details">Engine: Single-cylinder 124cc four-stroke</p>
                <p style="top: 45%;" class="bike-card-details">Power: 11 kW / 15 hp</p>
                <p style="top: 60%;" class="bike-card-details">Weight: 137 kg</p>
                <p style="top: 75%;" class="bike-card-details">Year: 2014</p>
            </button>
            <button class="bike" onclick="selectBike('xmf125c')">
                <p class="bike-choose-h">Fantic XMF 125 Competition</p>
                <img src="choose_bike/xmf125.webp" alt="Fantic XMF 125 Competition" class="bike-choose-img" style="width: 35%;">
                <p style="top: 30%;" class="bike-card-details">Engine: Single-cylinder 124cc four-stroke</p>
                <p style="top: 45%;" class="bike-card-details">Power: 11 kW / 15 hp</p>
                <p style="top: 60%;" class="bike-card-details">Weight: 137 kg</p>
                <p style="top: 75%;" class="bike-card-details">Year: 2027</p>
            </button>
            <button class="bike" onclick="selectBike('hsm125')">
                <p class="bike-choose-h">Husqvarna SM 125</p>
                <img src="choose_bike/huskysm.webp" alt="Husqvarna SM 125" class="bike-choose-img">
                <p style="top: 30%;" class="bike-card-details">Engine: Single-cylinder 125cc two-stroke</p>
                <p style="top: 45%;" class="bike-card-details">Power:  24-26 kW / 33-35 hp</p>
                <p style="top: 60%;" class="bike-card-details">Weight: 123 kg</p>
                <p style="top: 75%;" class="bike-card-details">Year: 2013</p>
            </button>
            <button class="bike" onclick="selectBike('ktm125exc')">
                <p class="bike-choose-h">KTM 125 EXC</p>
                <img src="choose_bike/excktms.webp" alt="KTM 125 EXC" class="bike-choose-img">
                <p style="top: 30%;" class="bike-card-details">Engine: Single-cylinder 125cc two-stroke</p>
                <p style="top: 45%;" class="bike-card-details">Power: 25-27 kW / 34-37 hp</p>
                <p style="top: 60%;" class="bike-card-details">Weight: 104 kg</p>
                <p style="top: 75%;" class="bike-card-details">Year: 2016</p>
            </button>
            


         </div>

    </Hero>

    <footer style="background-color: black; width: 100%; height: 10vh; text-align: center; color: white; container-type: size; margin: 0; position: absolute; bottom: 0;">
        
        <p style="padding-top: 13px; font-size: 30cqh;">© 2026 A1 Customs. All rights reserved.</p>
        
    </footer>
</body>
</html>
